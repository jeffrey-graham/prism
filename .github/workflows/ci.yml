name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  frontend:
    name: Frontend Type Check & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: frontend
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: frontend/package-lock.json
      - run: npm ci
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run test:coverage
      - name: Publish frontend coverage summary
        if: always() && hashFiles('frontend/coverage/coverage-summary.json') != ''
        run: |
          node -e '
            const fs = require("fs");
            const t = JSON.parse(fs.readFileSync("coverage/coverage-summary.json", "utf8")).total;
            const md = [
              "### Frontend Coverage Summary",
              "| Metric | Covered | Total | Pct |",
              "| :--- | ---: | ---: | ---: |",
              `| Statements | ${t.statements.covered} | ${t.statements.total} | ${t.statements.pct}% |`,
              `| Branches | ${t.branches.covered} | ${t.branches.total} | ${t.branches.pct}% |`,
              `| Functions | ${t.functions.covered} | ${t.functions.total} | ${t.functions.pct}% |`,
              `| Lines | ${t.lines.covered} | ${t.lines.total} | ${t.lines.pct}% |`,
              ""
            ].join("\n");
            console.log(md);
            if (process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md + "\n");
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: frontend-coverage
          path: frontend/coverage/
          retention-days: 14
      - run: npm run build
        env:
          NEXT_PUBLIC_NETWORK: testnet
          NEXT_PUBLIC_HORIZON_URL: https://horizon-testnet.stellar.org
          NEXT_PUBLIC_SOROBAN_RPC_URL: https://soroban-testnet.stellar.org
      - run: npx playwright install --with-deps chromium
      - run: npm run e2e

  indexer:
    name: Indexer Type Check & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: indexer
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: "20"
          cache: "npm"
          cache-dependency-path: indexer/package-lock.json
      - run: npm ci
      - run: npx prisma generate
      - run: npx tsc --noEmit
      - run: npm run lint
      - run: npm run test:coverage
      - name: Publish indexer coverage summary
        if: always() && hashFiles('indexer/coverage/coverage-summary.json') != ''
        run: |
          node -e '
            const fs = require("fs");
            const t = JSON.parse(fs.readFileSync("coverage/coverage-summary.json", "utf8")).total;
            const md = [
              "### Indexer Coverage Summary",
              "| Metric | Covered | Total | Pct |",
              "| :--- | ---: | ---: | ---: |",
              `| Statements | ${t.statements.covered} | ${t.statements.total} | ${t.statements.pct}% |`,
              `| Branches | ${t.branches.covered} | ${t.branches.total} | ${t.branches.pct}% |`,
              `| Functions | ${t.functions.covered} | ${t.functions.total} | ${t.functions.pct}% |`,
              `| Lines | ${t.lines.covered} | ${t.lines.total} | ${t.lines.pct}% |`,
              ""
            ].join("\n");
            console.log(md);
            if (process.env.GITHUB_STEP_SUMMARY) fs.appendFileSync(process.env.GITHUB_STEP_SUMMARY, md + "\n");
          '
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: indexer-coverage
          path: indexer/coverage/
          retention-days: 14
      - run: npm run build

  contracts:
    name: Contracts Lint, Test & Build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: contracts
    steps:
      - uses: actions/checkout@v4
      # rustup reads contracts/rust-toolchain.toml, which pins the channel and
      # pulls in the wasm target plus rustfmt and clippy.
      - run: rustup show active-toolchain
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: contracts
      - run: cargo fmt --all -- --check
      - run: cargo clippy --all-targets -- -D warnings
      - run: cargo test
      # The wasm build is the one that has to succeed for a deploy, and it uses
      # a different target and profile than the tests above.
      - run: cargo build --release --target wasm32v1-none

  docker:
    name: Docker Images & Compose Config
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      # Validates docker-compose.yml and its variable interpolation without
      # starting any containers.
      - run: docker compose config --quiet
      # A broken Dockerfile should fail the pull request, not the release.
      - run: docker build --tag prism-frontend:ci frontend
      - run: docker build --tag prism-indexer:ci indexer
